name: 에피소드 아이디어
description: 새 에피소드 아이디어 (리서치 세션 또는 사람)
title: "[아이디어] <역할> — <수학 개념>"
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        참고 자료 URL은 필수입니다. 출처에서 직접 확인하지 못한 수치는 값 뒤에 **검증 필요**를 붙여 주세요.
        등록 전에 기존 에피소드(`episodes/*/episode.json`)와 `idea` Issue에 같은 역할·개념이 없는지 확인해 주세요.
  - type: textarea
    id: role
    attributes:
      label: 역할 설정
      description: 학습자가 맡는 역할과 상황, 왜 이 수학이 필요한지 (2~4문장)
    validations: { required: true }
  - type: textarea
    id: concepts
    attributes:
      label: 수학 개념
      description: 핵심 개념과 필요한 선수 지식
      value: |
        - 핵심:
        - 선수 지식:
    validations: { required: true }
  - type: textarea
    id: goals
    attributes:
      label: 학습 목표 후보 (3개 이내)
      value: |
        1.
    validations: { required: true }
  - type: textarea
    id: interaction
    attributes:
      label: 핵심 인터랙션 아이디어
      description: 화면에서 무엇을 조작하고 무엇이 반응하는지. 휴대폰(360px) 터치로 가능한지
    validations: { required: true }
  - type: textarea
    id: data
    attributes:
      label: 실제 데이터·물리값
      value: |
        | 항목 | 값 | 단위 | 출처 URL | 상태 |
        |---|---|---|---|---|
        | | | | | 확인 / 검증 필요 |
    validations: { required: false }
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: URL과 한 줄 설명 (필수)
      value: |
        -
    validations: { required: true }
  - type: textarea
    id: novelty
    attributes:
      label: 기존 주제와의 차이
      description: 중복 확인 결과
    validations: { required: true }
  - type: dropdown
    id: difficulty
    attributes:
      label: 예상 난이도
      options: ["1", "2", "3", "4", "5"]
    validations: { required: true }
