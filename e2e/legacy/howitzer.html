<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미적분 자주포</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one column field manual — battlefield canvas on top, fire-control panel, live equation, y(t)/vy(t) charts, short notes */
:root{
  --bg:#E7EBE4; --panel:#F3F5F1; --ink:#1B2320; --muted:#5B6862; --line:#C5CEC6;
  --accent:#D4521C; --blue:#2C6A96; --ground:#7E8F6A; --ground2:#5F6F4E; --sky:#DCE4E3;
  --good:#2E7D4F; --bad:#B23A2E;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1A221E; --ink:#DCE4DD; --muted:#93A39A; --line:#2E3A34;
  --accent:#F0793F; --blue:#7FB6DE; --ground:#4D5C40; --ground2:#3A4630; --sky:#18211F;
  --good:#5DBB84; --bad:#E7766A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1A221E; --ink:#DCE4DD; --muted:#93A39A; --line:#2E3A34;
  --accent:#F0793F; --blue:#7FB6DE; --ground:#4D5C40; --ground2:#3A4630; --sky:#18211F;
  --good:#5DBB84; --bad:#E7766A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:18px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
header h1 span{color:var(--accent)}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.field{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sky)}
#field{display:block;width:100%;aspect-ratio:16/10;touch-action:manipulation}
.hud{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:11.5px;line-height:1.45;background:color-mix(in srgb,var(--panel) 82%,transparent);padding:6px 8px;border-radius:4px;font-variant-numeric:tabular-nums;pointer-events:none}
.banner{position:absolute;right:8px;top:8px;font-family:var(--display);font-size:18px;padding:4px 10px;border-radius:4px;background:var(--panel)}
.banner.hit{color:var(--good)} .banner.miss{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:14px}
.ctl{display:grid;gap:6px}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-weight:500}
.val{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.nudge{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;font-family:var(--mono);font-size:16px;cursor:pointer}
.mode{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mode button{flex:1;padding:9px 6px;border:0;background:var(--bg);color:var(--muted);font:inherit;font-weight:500;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.fire{flex:2;min-width:140px;padding:13px;border:0;border-radius:4px;background:var(--accent);color:#fff;font-family:var(--display);font-size:20px;letter-spacing:.06em;cursor:pointer}
.fire:disabled{opacity:.5;cursor:default}
.sec{flex:1;min-width:110px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.hint{font-family:var(--mono);font-size:12.5px;background:var(--bg);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 4px 4px 0;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.log{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;gap:2px}
.log b{font-weight:500}
.log-h{font-family:var(--body);font-size:12px;color:var(--muted);margin-bottom:2px}
.info{width:18px;height:18px;margin-left:6px;padding:0;border:1.5px solid var(--blue);border-radius:50%;background:var(--panel);color:var(--blue);font:700 11px/1 var(--body);font-style:italic;cursor:help;vertical-align:1px}
.tip{position:fixed;z-index:1100;display:grid;gap:7px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;padding:10px 12px;font:13px/1.55 var(--body);white-space:normal;word-break:keep-all;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.tip .tp{display:block}
.tip .ta,.tip .tb{font-family:var(--mono);font-weight:500;padding:0 3px;border-radius:3px;margin-right:2px}
.tip .ta{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.tip .tb{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.eq{font-family:var(--mono);font-size:12.5px;line-height:1.75;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:pre;font-variant-numeric:tabular-nums}
.eq .c{color:var(--muted)} .eq .a{color:var(--accent)} .eq .b{color:var(--blue)}
#chart{display:block;width:100%;height:220px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.notes{display:grid;gap:10px;max-width:65ch}
.notes p{margin:0}
.notes strong{color:var(--accent);font-weight:700}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
/* Tutorial: coach-mark card fixed at the bottom, highlighted element raised above a dim layer */
header{position:relative}
header h1{padding-right:96px}
/* 언어 토글: 튜토리얼이 화면을 어둡게 해도 누를 수 있게 dim(999)·카드(1001)보다 위 */
.lang-btn{position:absolute;top:0;right:0;z-index:1002;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:500 13px/1.2 var(--body);cursor:pointer}
.tut-btn{margin-top:10px;padding:8px 12px;border:1px solid var(--accent);border-radius:4px;background:transparent;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
.tut-dim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999}
.tut-hl{position:relative;z-index:1000;outline:3px solid var(--accent);outline-offset:4px;border-radius:6px;scroll-margin-top:14px}
.tut-hl.dim{box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
body.tut-open{padding-bottom:55vh}
.tut{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:48vh;overflow:auto;z-index:1001;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.tut-step{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tut h3{font-family:var(--display);font-weight:400;font-size:21px;margin:2px 0 8px;line-height:1.2}
.tut-body p{margin:0 0 8px}
.tut-body .o{color:var(--accent);font-weight:700} .tut-body .bl{color:var(--blue);font-weight:700}
.tut-body .ex{background:var(--bg);border-left:3px solid var(--blue);padding:8px 10px;border-radius:0 4px 4px 0;margin:0 0 8px}
.tut-body table{border-collapse:collapse;margin:0 0 8px;font-size:14px}
.tut-body td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.tut-body .quiz{display:grid;gap:6px;margin:0 0 8px}
.tut-body .quiz button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.tut-body .quiz .right{border:2px solid var(--good);color:var(--good);font-weight:700}
.tut-body .quiz .wrong{border:2px solid var(--bad);color:var(--bad)}
.tut-body .fb{font-weight:500} .tut-body .fb.good{color:var(--good)} .tut-body .fb.bad{color:var(--bad)}
.tut-body .act{padding:8px 12px;border:1px solid var(--blue);border-radius:4px;background:var(--bg);color:var(--blue);font:inherit;font-weight:700;cursor:pointer}
.tut-body table.steps{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;width:100%}
.tut-body table.steps tr:first-child td{font-family:var(--body);color:var(--muted)}
.tut-ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.tut-ctrl .fire{font-size:17px;padding:10px}
.tut-ctrl button:disabled{opacity:.45;cursor:default}
.tut-nav{display:flex;gap:8px;margin-top:6px}
.tut-nav button{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.tut-nav .skip{margin-right:auto;border-color:transparent;background:transparent;color:var(--muted)}
.tut-nav .next{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-width:96px}
.tut-nav button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <button class="lang-btn" id="langBtn" type="button"></button>
    <h1 data-i18n="title"></h1>
    <p data-i18n="lead"></p>
    <button class="tut-btn" id="tutOpen" data-i18n="tutOpen"></button>
  </header>

  <div class="field">
    <canvas id="field" data-i18n-aria="aField"></canvas>
    <div class="hud" id="hud"></div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <section class="panel" data-i18n-aria="aPanel">
    <div class="mode" role="group" data-i18n-aria="aEnv">
      <button id="mVac" aria-pressed="true" data-i18n="mVac"></button>
      <button id="mAir" aria-pressed="false" data-i18n="mAir"></button>
    </div>
    <div class="ctl">
      <div class="ctl-head"><label for="ang" data-i18n="angL"></label><span class="val" id="angV"></span></div>
      <div class="row"><button class="nudge" data-t="ang" data-d="-0.5" data-i18n-aria="aAngDown">−</button><input type="range" id="ang" min="10" max="80" step="0.5" value="45"><button class="nudge" data-t="ang" data-d="0.5" data-i18n-aria="aAngUp">+</button></div>
    </div>
    <div class="ctl">
      <div class="ctl-head"><span id="chgL" style="font-weight:500" data-i18n="chgL"></span><span class="val" id="velV"></span></div>
      <div class="mode" id="charges" role="group" aria-labelledby="chgL">
        <button data-v="60" aria-pressed="false"></button><button data-v="75" aria-pressed="true"></button><button data-v="93" aria-pressed="false"></button><button data-v="115" aria-pressed="false"></button>
      </div>
      <input type="hidden" id="vel" value="75">
    </div>
    <div class="actions">
      <button class="fire" id="fire" data-i18n="fire"></button>
      <button class="sec" id="pauseBtn" hidden></button>
      <button class="sec" id="stepBtn" hidden data-i18n="step05"></button>
      <button class="sec" id="hintBtn" data-i18n="hintBtn"></button>
      <button class="sec" id="newT" data-i18n="newT"></button>
    </div>
    <div class="stats"><span><span data-i18n="sDistL"></span> <b id="sDist"></b></span><span><span data-i18n="sDhL"></span> <b id="sDh"></b></span><span><span data-i18n="sWindL"></span> <b id="sWind"></b></span><span><span data-i18n="sScoreL"></span> <b id="sScore">0 / 0</b></span></div>
    <div class="log" id="log" aria-live="polite" hidden></div>
    <div class="hint" id="hint" hidden></div>
  </section>

  <section style="display:grid;gap:10px">
    <h2 data-i18n="eqH"></h2>
    <div class="eq" id="eq"></div>
    <p class="small" data-i18n="eqNote"></p>
  </section>

  <section style="display:grid;gap:10px">
    <h2 data-i18n="chartH"></h2>
    <canvas id="chart" data-i18n-aria="aChart"></canvas>
    <p class="small" data-i18n="chartNote"></p>
  </section>

  <section class="notes">
    <h2 data-i18n="notesH"></h2>
    <p data-i18n="n1"></p>
    <p data-i18n="n2"></p>
    <p data-i18n="n3"></p>
  </section>
</div>

<div class="tut-dim" id="tutDim" hidden></div>
<div class="tut" id="tut" role="dialog" aria-labelledby="tutTitle" hidden>
  <div class="tut-step" id="tutStep"></div>
  <h3 id="tutTitle"></h3>
  <div class="tut-body" id="tutBody"></div>
  <div class="tut-ctrl" id="tutCtrl" hidden>
    <button class="fire" id="tFire" data-i18n="fire"></button>
    <button class="sec" id="tPause"></button>
    <button class="sec" id="tStep" data-i18n="step05"></button>
  </div>
  <div class="tut-nav">
    <button class="skip" id="tutSkip" data-i18n="skip"></button>
    <button id="tutPrev" data-i18n="prev"></button>
    <button class="next" id="tutNext"></button>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);

// ───── 언어 ─────
// tr(ko, en): 지금 언어의 문자열. 동적으로 만드는 문자열은 모두 이걸로 감싸 그릴 때마다 다시 고름.
// P(ko, en): 나중에 tx()로 꺼낼 문자열 쌍 (튜토리얼 정의처럼 미리 만들어 두는 값용)
let lang='ko';try{lang=localStorage.getItem('supojaLang')==='en'?'en':'ko';}catch(e){}
const tr=(ko,en)=>lang==='en'?en:ko;
const P=(ko,en)=>({ko,en});
const tx=v=>typeof v==='function'?v():v&&typeof v==='object'&&'ko' in v?v[lang]:v;
// HTML에 고정된 문구 (data-i18n = 내용, data-i18n-aria = aria-label)
const I18N={
  docTitle:P('미적분 자주포','Calculus Howitzer'),
  title:P('미적분 <span>자주포</span>','Calculus <span>Howitzer</span>'),
  lead:P('장약으로 거리를 대충 정하고, 발사각으로 세밀하게 맞춰 깃발을 맞히세요. 포탄은 매 순간 <b>속도를 적분해 위치</b>를, <b>가속도를 적분해 속도</b>를 구하며 날아갑니다.',
    'Use the charge to set a rough distance, then fine-tune the launch angle to hit the flag. Every moment, the shell <b>integrates velocity to get position</b> and <b>integrates acceleration to get velocity</b>.'),
  tutOpen:P('수학이 무섭다면? 미적분 배우기','Scared of math? Learn calculus here'),
  aField:P('포격 전장','Battlefield'),aPanel:P('사격 통제','Fire control'),aEnv:P('환경','Environment'),
  mVac:P('진공 (식으로 풀림)','Vacuum (formula)'),mAir:P('공기저항 + 바람','Air drag + wind'),
  angL:P('발사각 θ','Launch angle θ'),aAngDown:P('각도 줄이기','Lower angle'),aAngUp:P('각도 늘리기','Raise angle'),
  chgL:P('장약 (포구속도 v₀)','Charge (muzzle speed v₀)'),
  fire:P('발사','FIRE'),step05:P('0.5초 진행 ⏭','Step 0.5 s ⏭'),hintBtn:P('계산 힌트','Hint'),newT:P('새 목표','New target'),
  sDistL:P('거리','Distance'),sDhL:P('고저차','Height diff'),sWindL:P('바람','Wind'),sScoreL:P('명중','Hits'),
  eqH:P('지금 돌아가는 계산','The math running right now'),
  eqNote:P('Δt = 0.01초마다 위 두 줄을 반복합니다. 작은 조각을 계속 더하는 것, 이것이 적분(오일러 방법)이에요.',
    'Every Δt = 0.01 s the two lines above repeat. Adding up tiny pieces over and over: that’s integration (Euler’s method).'),
  chartH:P('높이와 그 도함수','Height and its derivative'),aChart:P('높이 y(t)와 세로속도 vy(t) 그래프','Graph of height y(t) and vertical speed vy(t)'),
  chartNote:P('위: 높이 y(t). 아래: 세로속도 vy(t) = dy/dt. vy가 0이 되는 순간이 정점입니다. 미분값이 0인 곳에서 최댓값이 나오는 걸 눈으로 확인해 보세요. 아래 그래프의 색칠된 넓이를 더하면 높이가 얼마나 변했는지가 나와요. 이게 적분입니다.',
    'Top: height y(t). Bottom: vertical speed vy(t) = dy/dt. The moment vy hits 0 is the apex. See for yourself that the maximum is where the derivative is 0. Add up the shaded area in the lower graph and you get how much the height changed. That’s integration.'),
  notesH:P('게임 속 미적분','Calculus in the game'),
  n1:P('<strong>미분</strong> 포탄 옆의 점선은 접선이에요. 기울기 dy/dx = vy ÷ vx로, 궤적이 그 순간 어느 쪽으로 향하는지 알려줍니다.',
    '<strong>Derivative</strong> The dashed line by the shell is the tangent. Its slope dy/dx = vy ÷ vx tells you which way the path is heading at that instant.'),
  n2:P('<strong>적분</strong> 중력 가속도 −g를 시간에 대해 적분하면 vy = v₀sinθ − gt, 한 번 더 적분하면 y = v₀sinθ·t − ½gt². 진공에서는 여기서 사거리 공식 R = v₀²sin2θ / g가 나옵니다.',
    '<strong>Integral</strong> Integrate gravity’s acceleration −g over time and you get vy = v₀sinθ − gt; integrate again and y = v₀sinθ·t − ½gt². In a vacuum this leads to the range formula R = v₀²sin2θ / g.'),
  n3:P('<strong>수치적분</strong> 공기저항은 속도에 따라 힘이 바뀌어 깔끔한 식으로 풀리지 않아요. 그래서 컴퓨터는 아주 작은 Δt로 잘게 쪼개 더합니다. 진짜 사격통제 장치도 같은 원리를 씁니다.',
    '<strong>Numerical integration</strong> Air drag changes with speed, so it can’t be solved with a neat formula. So the computer chops time into tiny Δt steps and adds them up. Real fire-control systems use the same idea.'),
  skip:P('건너뛰기','Skip'),prev:P('이전','Back')
};
function applyLang(){document.documentElement.lang=lang;document.title=tx(I18N.docTitle);
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=tx(I18N[el.dataset.i18n]));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',tx(I18N[el.dataset.i18nAria])));
  document.querySelectorAll('#charges button').forEach(b=>b.textContent=chargeName(+b.dataset.v));
  // 버튼은 "바꿀 언어"를 보여 줌
  $('langBtn').textContent=tr('English','한국어');$('langBtn').setAttribute('aria-label',tr('Switch to English','한국어로 보기'));}
function setLang(l){lang=l;try{localStorage.setItem('supojaLang',l);}catch(e){}
  applyLang();updateStats();updateFlightBtns();
  if(lastResult&&!$('banner').hidden)showBanner(lastResult);
  if(!$('hint').hidden)showHint();
  if(ti>=0)tutRender(false);
  drawAll();}

const field=$('field'),fx=field.getContext('2d'),chart=$('chart'),cx=chart.getContext('2d');
const W=1000,G=9.8,K=0.00042,DT=0.01,SPEED=2.6,GUN_X=60,HIT_R=14;
let C={},seed=Math.random()*10,targetX=600,airMode=false,wind=0;
let shot=null,trail=[],samples=[],boom=null,shots=0,hits=0,lastResult=null;
// paused: 비행 중 정지, stepMode: 발사 직후 정지(한 걸음씩 진행), areaUp/areaDown: vy·Δt 조각의 누적합(그래프 아래 넓이)
let paused=false,stepMode=false,targetId=0,areaUp=0,areaDown=0,shotLog=[];

function readColors(){const s=getComputedStyle(document.documentElement);
  ['bg','panel','ink','muted','line','accent','blue','ground','ground2','sky','good','bad'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
readColors();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();drawAll();});}catch(e){}
new MutationObserver(()=>{readColors();drawAll();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function ground(x){return 45+20*Math.sin(x/105+seed)+11*Math.sin(x/43+seed*1.7)+0.05*x;}
function muzzle(){const a=+$('ang').value*Math.PI/180;return {x:GUN_X+Math.cos(a)*12,y:ground(GUN_X)+6+Math.sin(a)*12};}

function newTarget(){seed=Math.random()*10;targetX=Math.round(330+Math.random()*580);
  wind=airMode?Math.round((Math.random()*16-8)*10)/10:0;targetId++;
  shot=null;paused=false;trail=[];samples=[];boom=null;lastResult=null;areaUp=areaDown=0;$('banner').hidden=true;$('hint').hidden=true;$('fire').disabled=false;
  updateFlightBtns();updateStats();drawAll();}

// 장약: 실제 자주포처럼 포구속도는 몇 단계로만 고르고, 세밀한 조준은 발사각으로 함.
// 15°~75°에서 각 단계 사거리가 서로 겹치게 골라서 진공·공기저항 모두 목표(270~850 m)를 놓치는 구간이 없음
const CHARGES=[60,75,93,115];
const chargeName=v=>{const n=CHARGES.indexOf(v)+1;return tr(n+'호','Charge '+n);};
function setCharge(v){$('vel').value=v;$('vel').dispatchEvent(new Event('input'));}

// 탄착 결과 문구: 배너("+40 m 멀다")와 사격 기록("40 m 멀다")이 같이 씀
const missText=(err,signed)=>(signed&&err>0?'+':'')+(signed?err:Math.abs(err)).toFixed(0)+' m '+(err>0?tr('멀다','long'):tr('짧다','short'));
const resultText=r=>r.hit?tr('명중','Hit'):r.out?tr('화면 밖','Off screen'):missText(r.err,false);

function updateStats(){
  $('sDist').textContent=Math.round(targetX-GUN_X)+' m';
  const dh=ground(targetX)-ground(GUN_X);$('sDh').textContent=(dh>=0?'+':'')+dh.toFixed(0)+' m';
  $('sWind').textContent=airMode?(wind>0?'→ ':'← ')+Math.abs(wind).toFixed(1)+' m/s':tr('없음','none');
  $('sScore').textContent=hits+' / '+shots;
  $('angV').textContent=(+$('ang').value).toFixed(1)+'°';
  $('velV').textContent=chargeName(+$('vel').value)+' · '+(+$('vel').value).toFixed(0)+' m/s';
  document.querySelectorAll('#charges button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===+$('vel').value));
  renderLog();}

function size(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);return {w:r.width,h:r.height,d};}
let F,CH;
function resize(){F=size(field);CH=size(chart);drawAll();}
window.addEventListener('resize',resize);

function accel(vx,vy){if(!airMode)return [0,-G];
  const rx=vx-wind,ry=vy,s=Math.hypot(rx,ry);return [-K*s*rx,-G-K*s*ry];}

function fire(){if(shot)return;
  const a=+$('ang').value*Math.PI/180,v=+$('vel').value,m=muzzle();
  shot={x:m.x,y:m.y,vx:v*Math.cos(a),vy:v*Math.sin(a),t:0,ax:0,ay:-G,v0:v,ang:+$('ang').value,y0:m.y,tid:targetId,air:airMode};
  trail=[[m.x,m.y]];samples=[[0,m.y,shot.vy]];boom=null;areaUp=areaDown=0;$('banner').hidden=true;$('fire').disabled=true;shots++;
  paused=stepMode;updateFlightBtns();updateStats();tutEmit('fire');}

function stepSim(){const s=shot;const [ax,ay]=accel(s.vx,s.vy);s.ax=ax;s.ay=ay;
  s.vx+=ax*DT;s.vy+=ay*DT;s.x+=s.vx*DT;s.y+=s.vy*DT;s.t+=DT;
  const dy=s.vy*DT;if(dy>0)areaUp+=dy;else areaDown+=dy;
  if(Math.round(s.t/DT)%3===0){trail.push([s.x,s.y]);samples.push([s.t,s.y,s.vy]);}
  if(s.x>W+40||s.x<-40){land(false,true);return false;}
  if(s.y<=ground(s.x)&&s.vy<0){land(Math.abs(s.x-targetX)<=HIT_R,false);return false;}
  return true;}

function showBanner(r){const b=$('banner');b.hidden=false;b.className='banner '+(r.hit?'hit':'miss');
  b.textContent=r.hit?tr('명중!','Hit!'):r.out?tr('화면 밖','Off screen'):missText(r.err,true);}
function land(hit,out){const s=shot;samples.push([s.t,s.y,s.vy]);
  const err=s.x-targetX;lastResult={x:s.x,t:s.t,err,out,hit,v0:s.v0,ang:s.ang,tid:s.tid,air:s.air};
  if(hit)hits++;
  shotLog.push({...lastResult,n:shots});if(shotLog.length>40)shotLog.shift();
  boom={x:Math.min(Math.max(s.x,0),W),y:ground(Math.min(Math.max(s.x,0),W)),age:0,hit};
  showBanner(lastResult);
  shot=null;paused=false;$('fire').disabled=false;updateFlightBtns();updateStats();
  tutEmit('land',lastResult);
  if(hit){const tid=targetId;setTimeout(()=>{if(targetId===tid&&!shot)newTarget();},1600);}}

// 같은 목표·모드·현재 장약으로 쏜 기록 중 마지막 발(b)과, 그보다 앞서 각도가 달랐던 가장 최근 발(a)로 변화율 k = Δ탄착/Δ각도 (m/°)
function measureRate(list){const v=+$('vel').value,sh=list.filter(r=>!r.out&&r.tid===targetId&&r.air===airMode&&r.v0===v);
  if(!sh.length)return {};
  const b=sh[sh.length-1],a=[...sh].reverse().find(r=>r.ang!==b.ang);
  return {b,a,k:a?(b.x-a.x)/(b.ang-a.ang):null};}

// 자유 플레이 사격 기록: 이 목표에 쏜 최근 4발. 변화율 계산은 사용자 몫
function renderLog(){const el=$('log'),mine=shotLog.filter(r=>r.tid===targetId&&r.air===airMode);
  if(!mine.length){el.hidden=true;return;}el.hidden=false;
  const rows=mine.slice(-4).map(r=>`<div>${tr(r.n+'번째','#'+r.n)}  ${r.ang.toFixed(1)}° · ${chargeName(r.v0)} → <b>${resultText(r)}</b></div>`).join('');
  el.innerHTML=`<div class="log-h">${tr('사격 기록 · 이 목표','Shot log · this target')}</div>${rows}`;}

// 튜토리얼 단계가 lockResume으로 '계속'을 막고 있는지 (예: 0.5초 진행을 다 눌러 볼 때까지)
const resumeLocked=()=>paused&&ti>=0&&!!TUT[ti].lockResume&&TUT[ti].lockResume(st);
function updateFlightBtns(){const label=paused?tr('계속 ▶','Resume ▶'):tr('일시정지 ⏸','Pause ⏸'),lock=resumeLocked();
  $('pauseBtn').hidden=!shot;$('pauseBtn').textContent=label;$('pauseBtn').disabled=lock;$('stepBtn').hidden=!(shot&&paused);
  // 튜토리얼 카드 안의 같은 버튼들은 숨기지 않고 비활성화만 (자리 고정)
  $('tFire').disabled=!!shot;$('tPause').disabled=!shot||lock;$('tPause').textContent=label;$('tStep').disabled=!(shot&&paused);}
function setPaused(p){if(!shot||(!p&&resumeLocked()))return;paused=p;updateFlightBtns();if(p)tutEmit('pause',{...shot});}
// 0.5초(= Δt 50번)만큼 진행하고, 그동안 쌓인 높이 조각을 튜토리얼에 알림
function stepOnce(){if(!shot)return;const s=shot,t0=s.t,vy0=s.vy,y0=s.y;
  for(let i=0;i<50&&shot;i++){if(!stepSim())break;}
  tutEmit('step',{t0,t1:s.t,vy0,vy1:s.vy,dy:s.y-y0,ytot:s.y-s.y0});}

let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(shot&&!paused){acc+=dt*SPEED;while(acc>=DT&&shot){if(!stepSim()){acc=0;break;}acc-=DT;}}
  if(boom){boom.age+=dt;if(boom.age>1.2)boom.age=1.2;}
  drawAll();requestAnimationFrame(loop);}

function drawField(){if(!F)return;const {w,h,d}=F,sc=w/W,H=h/sc;
  fx.setTransform(d,0,0,d,0,0);fx.clearRect(0,0,w,h);
  const X=x=>x*sc,Y=y=>h-y*sc;
  fx.fillStyle=C.sky;fx.fillRect(0,0,w,h);
  // range grid every 100 m
  fx.strokeStyle=C.line;fx.lineWidth=1;fx.fillStyle=C.muted;fx.font='10px "IBM Plex Mono",monospace';
  for(let gx=100;gx<W;gx+=100){fx.beginPath();fx.moveTo(X(gx),0);fx.lineTo(X(gx),h);fx.stroke();fx.fillText(gx-GUN_X>0?(gx)+'':'',X(gx)+3,12);}
  for(let gy=100;gy<H;gy+=100){fx.beginPath();fx.moveTo(0,Y(gy));fx.lineTo(w,Y(gy));fx.stroke();}
  // terrain
  fx.beginPath();fx.moveTo(0,h);for(let x=0;x<=W;x+=5)fx.lineTo(X(x),Y(ground(x)));fx.lineTo(w,h);fx.closePath();
  fx.fillStyle=C.ground;fx.fill();fx.strokeStyle=C.ground2;fx.lineWidth=2;fx.stroke();
  // vacuum ghost hint
  if(!$('hint').hidden&&!airMode){const ans=neededAngles();if(ans){const cur=+$('ang').value,best=Math.abs(ans[0]-cur)<=Math.abs(ans[1]-cur)?ans[0]:ans[1];
    const v=+$('vel').value,a=best*Math.PI/180,m=muzzle();
    fx.setLineDash([2,5]);fx.strokeStyle=C.blue;fx.lineWidth=1.5;fx.beginPath();
    for(let t=0;t<40;t+=0.05){const x=m.x+v*Math.cos(a)*t,y=m.y+v*Math.sin(a)*t-0.5*G*t*t;if(t===0)fx.moveTo(X(x),Y(y));else fx.lineTo(X(x),Y(y));if(y<ground(x)&&t>0.5)break;}
    fx.stroke();fx.setLineDash([]);}}
  // target flag
  const ty=ground(targetX);fx.strokeStyle=C.ink;fx.lineWidth=1.5;fx.beginPath();fx.moveTo(X(targetX),Y(ty));fx.lineTo(X(targetX),Y(ty+28));fx.stroke();
  fx.fillStyle=C.accent;fx.beginPath();fx.moveTo(X(targetX),Y(ty+28));fx.lineTo(X(targetX)+14,Y(ty+23));fx.lineTo(X(targetX),Y(ty+18));fx.fill();
  fx.strokeStyle=C.accent;fx.globalAlpha=.5;fx.beginPath();fx.moveTo(X(targetX-HIT_R),Y(ty)+2);fx.lineTo(X(targetX+HIT_R),Y(ty)+2);fx.lineWidth=3;fx.stroke();fx.globalAlpha=1;
  // howitzer
  const gy=ground(GUN_X),a=+$('ang').value*Math.PI/180;
  fx.fillStyle=C.ink;fx.save();fx.translate(X(GUN_X),Y(gy+6));fx.rotate(-a);fx.fillRect(0,-2.5,Math.max(14,12*sc*1.4),5);fx.restore();
  fx.beginPath();fx.roundRect?fx.roundRect(X(GUN_X)-13,Y(gy+9),26,10,3):fx.rect(X(GUN_X)-13,Y(gy+9),26,10);fx.fill();
  fx.fillStyle=C.ground2;for(let i=-1;i<=1;i++){fx.beginPath();fx.arc(X(GUN_X)+i*8,Y(gy)-1,3.5,0,7);fx.fill();}
  // trail
  if(trail.length>1){fx.strokeStyle=C.accent;fx.lineWidth=2;fx.beginPath();trail.forEach((p,i)=>i?fx.lineTo(X(p[0]),Y(p[1])):fx.moveTo(X(p[0]),Y(p[1])));
    if(shot)fx.lineTo(X(shot.x),Y(shot.y));fx.stroke();}
  // shell + tangent
  if(shot){const px=X(shot.x),py=Math.max(6,Y(shot.y)),sp=Math.hypot(shot.vx,shot.vy),L=70;
    fx.setLineDash([5,4]);fx.strokeStyle=C.blue;fx.lineWidth=1.5;fx.beginPath();
    fx.moveTo(px-shot.vx/sp*L*.6,py+shot.vy/sp*L*.6);fx.lineTo(px+shot.vx/sp*L,py-shot.vy/sp*L);fx.stroke();fx.setLineDash([]);
    fx.fillStyle=C.ink;fx.beginPath();fx.arc(px,py,4,0,7);fx.fill();
    fx.fillStyle=C.blue;fx.font='11px "IBM Plex Mono",monospace';
    fx.fillText('dy/dx='+(shot.vy/shot.vx).toFixed(2),Math.min(px+8,w-90),Math.max(py-10,24));
    if(Y(shot.y)<0){fx.fillStyle=C.ink;fx.fillText('▲ '+shot.y.toFixed(0)+' m',Math.min(px-10,w-70),14);}}
  // apex marker
  if(samples.length>2){const ap=trail.reduce((b,p)=>p[1]>b[1]?p:b,trail[0]);
    if(ap&&ap[1]<H){fx.fillStyle=C.blue;fx.beginPath();fx.arc(X(ap[0]),Y(ap[1]),3,0,7);fx.fill();}}
  // explosion
  if(boom){const r=6+boom.age*40,al=Math.max(0,1-boom.age/1.2);fx.globalAlpha=al;fx.strokeStyle=boom.hit?C.good:C.bad;fx.lineWidth=3;
    fx.beginPath();fx.arc(X(boom.x),Y(boom.y),r,0,7);fx.stroke();fx.globalAlpha=1;}
  // wind arrow
  if(airMode&&wind){const x0=w-70,y0=h-14,len=Math.abs(wind)*4,dir=Math.sign(wind);fx.strokeStyle=C.ink;fx.fillStyle=C.ink;fx.lineWidth=2;
    fx.beginPath();fx.moveTo(x0-dir*len/2,y0);fx.lineTo(x0+dir*len/2,y0);fx.stroke();
    fx.beginPath();fx.moveTo(x0+dir*len/2,y0);fx.lineTo(x0+dir*(len/2-6),y0-4);fx.lineTo(x0+dir*(len/2-6),y0+4);fx.fill();}
}

function f(n,p=1){return (n>=0?' ':'')+n.toFixed(p);}
function drawHud(){const s=shot;
  if(s){$('hud').innerHTML='t  '+s.t.toFixed(2)+' s<br>x  '+s.x.toFixed(1)+' m<br>y  '+s.y.toFixed(1)+' m<br>vx '+s.vx.toFixed(1)+'<br>vy '+s.vy.toFixed(1);}
  else if(lastResult){$('hud').innerHTML=tr('비행 ','Flight ')+lastResult.t.toFixed(2)+' s<br>'+tr('탄착 ','Impact ')+lastResult.x.toFixed(0)+' m<br>'+tr('목표 ','Target ')+targetX+' m';}
  else $('hud').innerHTML=tr('목표 ','Target ')+targetX+' m<br>'+tr('준비 완료','Ready');}

function drawEq(){const s=shot||{x:muzzle().x,y:muzzle().y,vx:+$('vel').value*Math.cos($('ang').value*Math.PI/180),vy:+$('vel').value*Math.sin($('ang').value*Math.PI/180),ax:accel(0,0)[0],ay:-G,t:0};
  const [ax,ay]=shot?[s.ax,s.ay]:accel(s.vx,s.vy);
  const c=t=>'<span class="c">'+t+'</span>';
  const line1=airMode?c(tr('// 가속도: 중력 + 공기저항 −k|v−w|(v−w)','// acceleration: gravity + drag −k|v−w|(v−w)')):c(tr('// 가속도: 중력만 있음','// acceleration: gravity only'));
  $('eq').innerHTML=line1+'\n'+
  '<span class="a">a</span>  = ('+f(ax,2)+', '+f(ay,2)+') m/s²\n'+
  c(tr('// 속도 ← 속도 + 가속도·Δt   (가속도를 적분)','// velocity ← velocity + accel·Δt   (integrate accel)'))+'\n'+
  '<span class="b">v</span>  = ('+f(s.vx)+', '+f(s.vy)+') m/s\n'+
  c(tr('// 위치 ← 위치 + 속도·Δt     (속도를 적분)','// position ← position + velocity·Δt   (integrate velocity)'))+'\n'+
  'p  = ('+f(s.x)+', '+f(s.y)+') m\n'+
  c(tr('// 접선 기울기 (미분)','// tangent slope (derivative)'))+'\n'+
  'dy/dx = vy / vx = '+(s.vy/s.vx).toFixed(3);}

function drawChart(){if(!CH)return;const {w,h,d}=CH;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,w,h);
  const pad=36,mid=h/2,top=[10,mid-12],bot=[mid+12,h-18];
  cx.font='10.5px "IBM Plex Mono",monospace';
  if(samples.length<2){cx.fillStyle=C.muted;cx.fillText(tr('발사하면 그래프가 그려집니다','Fire to draw the graph'),pad,mid);return;}
  const tMax=Math.max(samples[samples.length-1][0],1),ys=samples.map(s=>s[1]),vys=samples.map(s=>s[2]);
  const yMin=Math.min(...ys),yMax=Math.max(...ys),vMax=Math.max(...vys.map(Math.abs),1);
  const tx_=t=>pad+(t/tMax)*(w-pad-10);
  const yy=y=>top[1]-(y-yMin)/(yMax-yMin||1)*(top[1]-top[0]);
  const vy=v=>(bot[0]+bot[1])/2-v/vMax*(bot[1]-bot[0])/2;
  // axes
  cx.strokeStyle=C.line;cx.lineWidth=1;cx.beginPath();cx.moveTo(pad,top[0]);cx.lineTo(pad,top[1]);cx.lineTo(w-10,top[1]);
  cx.moveTo(pad,bot[0]);cx.lineTo(pad,bot[1]);cx.moveTo(pad,vy(0));cx.lineTo(w-10,vy(0));cx.stroke();
  cx.fillStyle=C.muted;cx.fillText('y',8,top[0]+10);cx.fillText(yMax.toFixed(0),2,top[0]+22);
  cx.fillText('vy',6,bot[0]+10);cx.fillText('0',20,vy(0)+4);cx.fillText(tMax.toFixed(1)+' s',w-48,h-4);
  // area under vy(t): 0선 위(올라간 높이)는 파랑, 아래(내려온 높이)는 주황으로 칠함
  const z=vy(0),end=samples[samples.length-1];
  cx.save();cx.beginPath();cx.moveTo(tx_(samples[0][0]),z);samples.forEach(s=>cx.lineTo(tx_(s[0]),vy(s[2])));cx.lineTo(tx_(end[0]),z);cx.closePath();cx.clip();
  cx.globalAlpha=.22;cx.fillStyle=C.blue;cx.fillRect(pad,bot[0],w,z-bot[0]);cx.fillStyle=C.accent;cx.fillRect(pad,z,w,bot[1]-z);cx.restore();
  cx.fillStyle=C.ink;cx.fillText(tr('넓이: 위 +','Area: up +')+areaUp.toFixed(0)+tr('  아래 ','  down ')+areaDown.toFixed(0)+tr('  합 ','  sum ')+f(areaUp+areaDown,0).trim()+' m',pad+4,h-4);
  // apex time
  let apex=null;for(let i=1;i<samples.length;i++)if(samples[i-1][2]>0&&samples[i][2]<=0){apex=samples[i][0];break;}
  if(apex!==null){cx.setLineDash([3,4]);cx.strokeStyle=C.muted;cx.beginPath();cx.moveTo(tx_(apex),top[0]);cx.lineTo(tx_(apex),bot[1]);cx.stroke();cx.setLineDash([]);
    cx.fillStyle=C.ink;cx.fillText(tr('vy=0 → 정점 t=','vy=0 → apex t=')+apex.toFixed(2)+'s',Math.min(tx_(apex)+4,w-150),vy(0)-6);}
  cx.lineWidth=2;cx.strokeStyle=C.accent;cx.beginPath();samples.forEach((s,i)=>i?cx.lineTo(tx_(s[0]),yy(s[1])):cx.moveTo(tx_(s[0]),yy(s[1])));cx.stroke();
  cx.strokeStyle=C.blue;cx.beginPath();samples.forEach((s,i)=>i?cx.lineTo(tx_(s[0]),vy(s[2])):cx.moveTo(tx_(s[0]),vy(s[2])));cx.stroke();
  cx.fillStyle=C.accent;cx.beginPath();cx.arc(tx_(end[0]),yy(end[1]),3,0,7);cx.fill();
  cx.fillStyle=C.blue;cx.beginPath();cx.arc(tx_(end[0]),vy(end[2]),3,0,7);cx.fill();}

function drawAll(){drawField();drawHud();drawEq();drawChart();}

// 진공 궤적 식 y = x·u − g·x²(1+u²)/(2v²) (u = tanθ)에 y(Δx) = Δh를 넣으면 u에 대한 이차방정식.
// 근 두 개 = 낮은 각(직사)과 높은 각(곡사). 근이 없으면 이 장약으로는 닿지 않음.
// 포구 위치가 각도에 따라 조금 바뀌는 건 무시하고 현재 포구 기준으로 계산
function neededAngles(){const v=+$('vel').value,m=muzzle(),dx=targetX-m.x,dh=ground(targetX)-m.y,c=G*dx*dx/(2*v*v);
  const D=dx*dx-4*c*(c+dh);if(D<0)return null;
  return [(dx-Math.sqrt(D))/(2*c),(dx+Math.sqrt(D))/(2*c)].map(u=>Math.atan(u)*180/Math.PI);}
function showHint(){const v=+$('vel').value,m=muzzle(),dx=targetX-m.x,dh=ground(targetX)-m.y,ans=neededAngles();
  let t='y(x) = x·tanθ − g·x² / (2v₀²cos²θ)'+eqInfo()+tr('  ← 시간 t를 소거한 궤적 식','  ← trajectory with time t eliminated')+'\n'+
  tr('y(Δx) = Δh 로 놓고 tanθ에 대한 이차방정식을 풀면 각도가 두 개 나와요','Set y(Δx) = Δh and solve the quadratic in tanθ: you get two angles')+'\n\n'+
  'Δx = '+dx.toFixed(1)+' m,  Δh = '+dh.toFixed(1)+' m,  v₀ = '+v.toFixed(0)+' m/s ('+chargeName(v)+')\n';
  t+=ans?tr('→ 진공 기준 θ ≈ '+ans[0].toFixed(1)+'° (낮게) 또는 '+ans[1].toFixed(1)+'° (높게)','→ In vacuum, θ ≈ '+ans[0].toFixed(1)+'° (low) or '+ans[1].toFixed(1)+'° (high)')
    :tr('→ 이 장약으로는 닿지 않아요. 장약을 올려 보세요.','→ This charge can’t reach. Try a bigger charge.');
  if(airMode)t+='\n\n'+tr('공기저항이 있으면 닫힌 식이 없어요. 공기가 붙잡아서 덜 날아가니 진공 값을 출발점으로 삼고, 한 발 쏘고 오차를 보며 고쳐 가세요.',
    'With air drag there’s no closed-form formula. The air holds the shell back, so it flies shorter. Use the vacuum value as a starting point, fire, and correct from the miss.');
  $('hint').innerHTML=t;$('hint').hidden=false;}

// 궤적 식 해설 팝업. 힌트 상자는 가로 스크롤이 있어 안에 띄우면 잘리므로 position:fixed로 아이콘 옆에 띄움
function eqInfo(){return '<span class="info-wrap"><button class="info" type="button" aria-label="'+tr('식 해설 보기','Explain this formula')+'" aria-expanded="false">i</button>'+
  '<span class="tip" role="tooltip" hidden>'+tr(
  '<b>포탄이 옆으로 x m 갔을 때, 높이 y는?</b>'+
  '<span class="tp"><span class="ta">x·tanθ</span> 중력이 없다면 포탄은 대포가 향한 방향으로 <b>곧게</b> 날아가요. '+
  'tanθ는 그 직선의 기울기(옆으로 1 m 갈 때 위로 몇 m)라서, x·tanθ는 <b>"곧게 갔을 때의 높이"</b>예요.</span>'+
  '<span class="tp"><span class="tb">− g·x² / (2v₀²cos²θ)</span> 중력 때문에 <b>떨어진 만큼</b>이에요. '+
  '옆으로 x m 가는 데 걸린 시간은 t = x ÷ (v₀cosθ)이고, 그동안 떨어진 거리 ½·g·t²에 이 t를 넣으면 이 모양이 돼요.</span>'+
  '<span class="tp"><b>곧게 간 높이 − 떨어진 만큼 = 실제 높이.</b> 떨어지는 양이 x²으로 커져서 궤적이 포물선으로 휘어요.</span>'+
  '<span class="tp small">왜 제곱일까요? 중력이 빠르기를 쌓고(적분 1번), 그 빠르기가 떨어진 거리를 쌓아요(적분 2번). '+
  '그래서 시간이 2배면 4배 떨어져요. 2장에서 손으로 쌓아 본 바로 그거예요.</span>'+
  '<span class="tp small">힌트는 깃발 위치(x = Δx)에서 높이가 깃발 높이(Δh)와 같아지는 θ를 찾은 거예요.</span>',
  '<b>When the shell has gone x m sideways, how high is it?</b>'+
  '<span class="tp"><span class="ta">x·tanθ</span> Without gravity the shell would fly <b>straight</b> along the barrel. '+
  'tanθ is that line’s slope (metres up per metre sideways), so x·tanθ is <b>“the height if it flew straight.”</b></span>'+
  '<span class="tp"><span class="tb">− g·x² / (2v₀²cos²θ)</span> How far it has <b>fallen</b> because of gravity. '+
  'Reaching x m sideways takes t = x ÷ (v₀cosθ). Put that t into the fall distance ½·g·t² and you get this.</span>'+
  '<span class="tp"><b>Straight-line height − fall = actual height.</b> The fall grows with x², which bends the path into a parabola.</span>'+
  '<span class="tp small">Why squared? Gravity piles up speed (integrate once), and that speed piles up fall distance (integrate twice). '+
  'So twice the time means four times the fall. That’s exactly what you stacked by hand in Chapter 2.</span>'+
  '<span class="tp small">The hint finds the θ where the height at the flag (x = Δx) equals the flag’s height (Δh).</span>')+
  '</span></span>';}
function tipShow(w){const b=w.querySelector('.info'),t=w.querySelector('.tip');t.hidden=false;b.setAttribute('aria-expanded','true');
  // 화면 밖으로 나가지 않게: 가로는 화면 안으로 맞추고, 아래 공간이 모자라면 아이콘 위에 띄움
  const r=b.getBoundingClientRect(),wd=Math.min(340,innerWidth-16);t.style.width=wd+'px';
  t.style.left=Math.min(Math.max(8,r.left+r.width/2-wd/2),innerWidth-wd-8)+'px';
  const ht=t.offsetHeight;t.style.top=(r.bottom+8+ht>innerHeight&&r.top-8-ht>0?r.top-8-ht:r.bottom+8)+'px';}
function tipHide(w){w.querySelector('.tip').hidden=true;w.querySelector('.info').setAttribute('aria-expanded','false');}
const hideTips=()=>document.querySelectorAll('.info-wrap').forEach(tipHide);
$('hint').addEventListener('mouseover',e=>{const w=e.target.closest('.info-wrap');if(w)tipShow(w);});
$('hint').addEventListener('mouseout',e=>{const w=e.target.closest('.info-wrap');if(w&&!w.contains(e.relatedTarget)&&!w.contains(document.activeElement))tipHide(w);});
$('hint').addEventListener('focusin',e=>{const w=e.target.closest('.info-wrap');if(w)tipShow(w);});
$('hint').addEventListener('focusout',e=>{const w=e.target.closest('.info-wrap');if(w&&!w.contains(e.relatedTarget))tipHide(w);});
// 터치 기기: 탭하면 열리고(포커스), 다른 곳을 탭하면 닫힘(포커스 해제)
$('hint').addEventListener('click',e=>{const w=e.target.closest('.info-wrap');if(w){e.target.closest('.info')?.focus();tipShow(w);}});
window.addEventListener('scroll',hideTips,{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTips();});

$('fire').onclick=fire;$('newT').onclick=newTarget;
$('hintBtn').onclick=()=>{if($('hint').hidden)showHint();else $('hint').hidden=true;};
['ang','vel'].forEach(id=>$(id).addEventListener('input',()=>{updateStats();if(!$('hint').hidden)showHint();}));
document.querySelectorAll('#charges button').forEach(b=>b.onclick=()=>setCharge(+b.dataset.v));
document.querySelectorAll('.nudge').forEach(b=>b.onclick=()=>{const el=$(b.dataset.t);el.value=Math.min(+el.max,Math.max(+el.min,+el.value+ +b.dataset.d));el.dispatchEvent(new Event('input'));});
function setMode(air){airMode=air;$('mVac').setAttribute('aria-pressed',!air);$('mAir').setAttribute('aria-pressed',air);newTarget();}
$('mVac').onclick=()=>setMode(false);$('mAir').onclick=()=>setMode(true);
$('langBtn').onclick=()=>setLang(lang==='ko'?'en':'ko');

$('pauseBtn').onclick=$('tPause').onclick=()=>setPaused(!paused);
$('stepBtn').onclick=$('tStep').onclick=stepOnce;
$('tFire').onclick=fire;

// ───── 미적분 배우기 (튜토리얼) ─────
// 단계 속성: ch 장 이름, target 강조할 요소, dim 나머지 어둡게, ctrl 카드 안에 발사/정지/진행 버튼 표시,
// body(st) 내용, gate(st) 다음으로 넘어갈 조건, auto(st) 참이면 자동 진행, waitLabel 대기 중 버튼 문구,
// on.{fire,land,pause,step,quiz}(st,data) 게임 이벤트 처리, enter/exit 단계 진입·이탈 시 실행.
// st는 단계마다 새로 만들어지는 상태 객체. ch·title·waitLabel·퀴즈 문구는 P(ko,en), body는 그릴 때 tr()로 언어를 고름
let ti=-1,st={},tutHl=[],tutTimer=null;
const FIELD=()=>$('field').parentElement;
const sg=(n,p=0)=>(n>=0?'+':'')+n.toFixed(p);

function quizStep(o){const q=o.quiz;return {...o,waitLabel:P('정답을 골라 보세요','Pick an answer'),gate:s=>s.ok,
  on:{quiz:(s,i)=>{s.picked=i;s.ok=i===q.answer;}},
  body:s=>(o.intro?o.intro(s):'')+`<p><b>Q. ${tx(q.q)}</b></p><div class="quiz">`+
    q.options.map((t,i)=>`<button data-q="${i}" class="${s.picked===i?(s.ok?'right':'wrong'):''}">${tx(t)}</button>`).join('')+'</div>'+
    (s.picked==null?'':s.ok?`<p class="fb good">${tr('⭕ 정답!','⭕ Correct!')} ${tx(q.explain)}</p>`:`<p class="fb bad">${tr('❌ 아쉬워요.','❌ Not quite.')} ${tx(q.hint)}</p>`)};}

// 0.5초 조각 표: 조각(vy·Δt)을 더해 높이가 쌓이는 과정 = 리만 합
// 6줄이 넘으면 첫 줄(0→0.5초)은 비교용으로 남기고 중간을 ⋮로 접음
function stepTable(s){const r=s.recs||[];if(!r.length)return '';
  const row=x=>`<tr><td>${x.t0.toFixed(1)}→${x.t1.toFixed(1)}s</td><td>${x.vy0.toFixed(1)} → ${x.vy1.toFixed(1)}</td><td>${sg(x.dy,1)} m</td><td><b>${sg(x.ytot,1)} m</b></td></tr>`;
  const rows=r.length>6?[row(r[0]),'<tr><td colspan="4" style="text-align:center">⋮</td></tr>',...r.slice(-5).map(row)]:r.map(row);
  return '<table class="steps"><tr><td>'+tr('시간','Time')+'</td><td>'+tr('위로 빠르기 vy','Upward speed vy')+'</td><td>'+tr('이번 조각<br>= 평균 vy × 0.5초','This piece<br>= avg vy × 0.5 s')+'</td><td>'+tr('쌓인 높이','Stacked height')+'</td></tr>'+rows.join('')+'</table>';}
// "손으로 쌓아 보기"에서 잰 첫 조각(0→0.5초). 뒤 단계의 문제와 오차 표가 이 숫자를 씀
let stepRec0=null;
// "실험: 각도만 바꿔 보기"의 결과 {ang, dist}. 다음 단계의 사거리 그래프에 점으로 찍음
let angleExp=[];
// 기록이 없으면 지금 장약·각도로 첫 0.5초를 계산한 값 (진공에서는 vy가 0.5초에 4.9씩 일정하게 줄어듦)
const rec0=()=>{if(stepRec0)return stepRec0;const vy0=+$('vel').value*Math.sin(+$('ang').value*Math.PI/180),vy1=vy0-G*0.5;return {vy0,vy1,dy:(vy0+vy1)/4};};

const clampAng=a=>Math.min(80,Math.max(10,a));
function setAngle(a){$('ang').value=clampAng(a);$('ang').dispatchEvent(new Event('input'));}
// 조준 미션 시작 설정: 목표가 최대 사거리의 80% 안쪽에 들어오는 가장 약한 장약 + 30°.
// 45°에서 멀리 떨어진 각도에서 시작해야 각도 변화율이 커서 조준이 잘 됨. 공기저항이면 사거리를 약 70%로 어림
function aimSetup(){const d=targetX-GUN_X,f=airMode?0.7:1;
  setCharge(CHARGES.find(v=>v*v/G*f*0.8>=d)||CHARGES[CHARGES.length-1]);setAngle(30);}

// 변화율(할선 기울기)로 조준: 같은 장약에서 각도만 다른 두 발로 Δ탄착/Δ각도를 재고 필요한 보정을 계산
function aimOnLand(s,r){(s.shots=s.shots||[]).push(r);if(r.hit)s.hit=true;}
const setaBtn=na=>`<p><button class="act" data-act="seta" data-v="${na}">${tr('θ = '+na.toFixed(1)+'° 넣기','Set θ = '+na.toFixed(1)+'°')}</button> ${tr('그리고 <b>발사!</b>','then <b>FIRE!</b>')}</p>`;
function aimBody(s){
  if(s.hit)return '<p class="fb good">'+tr('🎯 명중! 감이 아니라 <b>변화율(미분)로 계산해서</b> 맞혔어요.','🎯 Hit! Not by feel: you <b>calculated it with the rate of change (the derivative)</b>.')+'</p>';
  const {b,a,k}=measureRate(s.shots||[]),v=+$('vel').value,i=CHARGES.indexOf(v);
  if(!b)return '<p>'+tr(`먼저 <b>지금 설정(${(+$('ang').value).toFixed(1)}° · ${chargeName(v)})</b>으로 한 발 쏘세요.`,`First, fire once with the <b>current settings (${(+$('ang').value).toFixed(1)}° · ${chargeName(v)})</b>.`)+'</p>';
  let h='<p>'+tr(`방금 탄착: 깃발보다 <b>${Math.abs(b.err).toFixed(0)} m ${b.err>0?'멀리':'짧게'}</b> (${b.ang.toFixed(1)}°)`,`Last impact: <b>${Math.abs(b.err).toFixed(0)} m ${b.err>0?'long':'short'}</b> of the flag (${b.ang.toFixed(1)}°)`)+'</p>';
  if(!a){// 멀면 45°에서 멀어지는 쪽, 짧으면 45° 쪽으로 3° (둘 다 오차를 줄이는 방향)
    const away=b.ang<45?-3:3,na=clampAng(b.ang+(b.err>0?away:-away));
    return h+'<p>'+tr('이번엔 <b>장약은 그대로</b> 두고 각도만 살짝 바꿔 한 발 더 쏘세요. 그래야 "각도를 바꾸면 탄착점이 얼마나 움직이나"를 <b>잴</b> 수 있어요.',
      'Now keep the <b>charge the same</b>, change only the angle a little, and fire again. That way you can <b>measure</b> “how far the impact moves when the angle changes.”')+'</p>'+setaBtn(na);}
  const da=b.ang-a.ang,dx=b.x-a.x;
  if(Math.abs(k)<3)return h+'<div class="ex">'+tr(`각도를 ${sg(da,1)}° 바꿨는데 탄착점은 ${sg(dx,0)} m밖에 안 움직였어요 (1°당 ${Math.abs(k).toFixed(1)} m).`,`You changed the angle by ${sg(da,1)}°, but the impact moved only ${sg(dx,0)} m (${Math.abs(k).toFixed(1)} m per 1°).`)+'</div>'+
    '<p>'+tr('<b>45° 근처</b>라서 그래요. 사거리 그래프의 꼭대기라 기울기가 거의 0이거든요. 45°에서 멀리 떨어진 각도로 다시 재 보세요.',
      'That’s because you’re <b>near 45°</b>, the top of the range graph, where the slope is almost 0. Measure again from an angle far from 45°.')+'</p>'+
    `<p><button class="act" data-act="seta" data-v="30">${tr('θ = 30° 넣기','Set θ = 30°')}</button></p>`;
  const rem=targetX-b.x,need=rem/k,na=Math.round((b.ang+need)*2)/2;
  h+='<div class="ex">'+tr(
    `① 각도를 <b>${sg(da,1)}°</b> 바꿨더니 탄착점이 <b>${sg(dx,0)} m</b> 움직였어요<br>`+
    `② 변화율 = ${sg(dx,0)} ÷ ${sg(da,1)} = <b>1°당 ${k.toFixed(1)} m</b> <span class="o">← 이게 미분</span><br>`+
    `③ 깃발까지: <b>${sg(rem,0)} m</b> (${rem<0?'지나쳤으니 덜 가야 해요':'더 가야 해요'})<br>`+
    `④ 필요한 각도 변화 = ${sg(rem,0)} ÷ ${k.toFixed(1)} = <b>${sg(need,1)}°</b><br>→ θ ≈ <b>${na.toFixed(1)}°</b>`,
    `① Changing the angle by <b>${sg(da,1)}°</b> moved the impact <b>${sg(dx,0)} m</b><br>`+
    `② Rate of change = ${sg(dx,0)} ÷ ${sg(da,1)} = <b>${k.toFixed(1)} m per 1°</b> <span class="o">← that’s the derivative</span><br>`+
    `③ To the flag: <b>${sg(rem,0)} m</b> (${rem<0?'overshot, so go shorter':'need to go farther'})<br>`+
    `④ Angle change needed = ${sg(rem,0)} ÷ ${k.toFixed(1)} = <b>${sg(need,1)}°</b><br>→ θ ≈ <b>${na.toFixed(1)}°</b>`)+'</div>';
  // 45°를 넘어가면 변화율의 부호가 바뀌어 직선 어림이 안 통함 = 이 장약의 최대 사거리로도 모자람
  if((b.ang<45)!==(na<45)||na>80){const up=CHARGES[i+1];
    return h+'<p>'+tr('필요한 각도가 45°를 넘어가요. 이 장약은 <b>45°로 쏴도 모자란다</b>는 뜻이에요. 장약을 올리고 다시 두 발로 재 보세요.',
      'The needed angle goes past 45°. That means this charge <b>falls short even at 45°</b>. Raise the charge and measure again with two shots.')+'</p>'+
      (up?`<p><button class="act" data-act="setc" data-v="${up}">${tr(chargeName(up)+'로 올리기','Raise to '+chargeName(up))}</button></p>`:'');}
  if(na<10){const down=CHARGES[i-1];
    return h+'<p>'+tr('그만큼 각도를 낮출 수는 없어요. 이 장약이 너무 세다는 뜻이에요. 장약을 내리고 다시 두 발로 재 보세요.',
      'You can’t lower the angle that much. This charge is too strong. Lower the charge and measure again with two shots.')+'</p>'+
      (down?`<p><button class="act" data-act="setc" data-v="${down}">${tr(chargeName(down)+'로 내리기','Lower to '+chargeName(down))}</button></p>`:'');}
  return h+setaBtn(na)+'<p class="small">'+tr('빗나가도 괜찮아요. 최근 두 발로 다시 재면 더 정확해져요. 진짜 포병의 "수정 사격"이 이 방법이에요.',
    'Missing is okay. Measuring again with your last two shots makes it more accurate. This is how real artillery “adjusts fire.”')+'</p>';}

// 사거리 그래프 R(θ) = v₀²·sin2θ / g (진공·평지). 실험한 점과 30°·45°의 접선을 같이 그림
function rangeSvg(pts){const v=+$('vel').value,R=t=>v*v*Math.sin(2*t*Math.PI/180)/G,Rm=v*v/G*1.12;
  const X=t=>30+(t-10)/70*260,Y=r=>130-r/Rm*118,slope=t=>2*v*v*Math.cos(2*t*Math.PI/180)/G*Math.PI/180;
  let p='';for(let t=10;t<=80;t+=1)p+=(t===10?'M':'L')+X(t).toFixed(1)+' '+Y(R(t)).toFixed(1);
  const tan=(t0,col)=>{const y0=R(t0),k=slope(t0);return `<line x1="${X(t0-9)}" y1="${Y(y0-k*9)}" x2="${X(t0+9)}" y2="${Y(y0+k*9)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/>`;};
  const dots=pts.map(q=>`<circle cx="${X(q.ang)}" cy="${Y(q.dist)}" r="3.5" fill="${C.accent}"/>`).join('');
  return `<svg viewBox="0 0 300 150" style="width:100%;max-width:420px;display:block;margin:0 0 8px" role="img" aria-label="${tr('발사각에 따른 사거리 그래프','Range vs. launch angle graph')}">
    <line x1="30" y1="130" x2="292" y2="130" stroke="${C.line}"/><line x1="30" y1="8" x2="30" y2="130" stroke="${C.line}"/>
    ${[10,30,45,60,80].map(t=>`<text x="${X(t)}" y="144" font-size="9" text-anchor="middle" fill="${C.muted}">${t}°</text>`).join('')}
    <text x="4" y="14" font-size="9" fill="${C.muted}">${tr('거리','Range')}</text>
    <path d="${p}" fill="none" stroke="${C.blue}" stroke-width="2"/>${tan(45,C.ink)}${tan(30,C.ink)}${dots}
    <text x="${X(45)}" y="${Y(R(45))-8}" font-size="9" text-anchor="middle" fill="${C.ink}">${tr('45°: 기울기 0','45°: slope 0')}</text>
    <text x="${X(30)-4}" y="${Y(R(30))+16}" font-size="9" text-anchor="end" fill="${C.ink}">${tr('30°: 1°당 '+slope(30).toFixed(0)+' m','30°: '+slope(30).toFixed(0)+' m per 1°')}</text></svg>`;}

const CH1=P('1장 · 쏴 보기','Ch.1 · First shot'),CH2=P('2장 · 적분','Ch.2 · Integrals'),CH3=P('3장 · 미분','Ch.3 · Derivatives'),

        <p>속도계처럼 평균이 아니라 <b>"딱 지금"</b>의 변화를 재는 것, 이게 <span class="o">미분</span>이에요. 다른 순간에도 멈춰 보세요.</p>`,
        `<div class="ex">Frozen moment: sideways <b>${p.vx.toFixed(1)}</b> m/s, up <b>${p.vy.toFixed(1)}</b> m/s<br>Slope of the blue line dy/dx = ${p.vy.toFixed(1)} ÷ ${p.vx.toFixed(1)} = <b>${k.toFixed(2)}</b></div>
        <p>Meaning: right now, for every 1 m sideways it goes <b>${k.toFixed(2)} m</b> up → <b>${k>0.05?'climbing':k<-0.05?'falling':'almost at the top'}</b>!</p>
        <p>Like a speedometer, it measures change <b>“right now,”</b> not an average. That’s a <span class="o">derivative</span>. Try pausing at other moments too.</p>`);}},
  quizStep({ch:CH3,title:QC,quiz:{q:P('날아가는 포탄 옆에 <span class="bl">dy/dx = −0.80</span>이 떠 있어요. 지금 포탄은?','Next to the flying shell you see <span class="bl">dy/dx = −0.80</span>. What is the shell doing?'),
    options:[P('올라가는 중','Climbing'),P('딱 꼭대기','Exactly at the top'),P('내려가는 중','Falling')],answer:2,
    explain:P('기울기가 음수 = 옆으로 갈수록 높이가 줄어든다 = 내려가는 중.','A negative slope = the height drops as it moves sideways = falling.'),
    hint:P('+는 오르막, −는 내리막이에요.','+ means uphill, − means downhill.')}}),
  {ch:CH3,target:()=>[FIELD()],ctrl:true,waitLabel:P('꼭대기에서 일시정지','Pause at the top'),gate:s=>s.ok||(s.tries||0)>=4,
    on:{pause:(s,p)=>{s.tries=(s.tries||0)+1;s.vy=p.vy;if(Math.abs(p.vy)<4)s.ok=true;},
        step:(s,r)=>{s.vy=r.vy1;if(Math.abs(r.vy1)<4)s.ok=true;}},
    title:P('미션: 꼭대기를 잡아라','Mission: catch the top'),body:s=>{
      let h=tr(`<p>꼭대기에서는 올라가지도 내려가지도 않아요. <b>위로 빠르기 vy = 0</b>, 기울기 = 0인 순간이죠.</p>
        <p>발사하고, 포탄이 <b>가장 높은 순간</b>에 <b>일시정지 ⏸</b>를 누르세요. (조금 일찍 멈추고 <b>0.5초 진행</b>으로 다가가도 돼요.)</p>`,
        `<p>At the top, the shell is neither rising nor falling: <b>upward speed vy = 0</b>, slope = 0.</p>
        <p>Fire, and press <b>Pause ⏸</b> at the shell’s <b>highest moment</b>. (You can also stop a bit early and creep up with <b>Step 0.5 s</b>.)</p>`);
      if(s.vy!=null){
        if(s.ok)h+='<p class="fb good">'+tr(`🎯 성공! vy = ${s.vy.toFixed(1)}, 거의 0이에요. "<b>변화가 0인 곳 = 가장 높은 곳</b>". 수학 시험 단골 문제를 직접 잡아냈어요.`,
          `🎯 Got it! vy = ${s.vy.toFixed(1)}, almost 0. “<b>Where the change is 0 = the highest point.</b>” You just caught a classic exam question yourself.`)+'</p>';
        else h+=`<p class="fb bad">vy = ${sg(s.vy,1)} → `+(s.vy>0?tr('아직 <b>올라가는 중</b>이에요. 조금 더 기다리세요.','still <b>climbing</b>. Wait a bit longer.'):tr('이미 <b>내려오는 중</b>이에요. 조금 더 일찍!','already <b>falling</b>. A bit earlier!'))+'</p>';
        if(!s.ok&&s.tries>=4)h+='<p class="small">'+tr('어려우면 넘어가도 괜찮아요. 꼭대기 = vy가 0인 곳, 이것만 기억하세요.','It’s okay to move on if this is tricky. Just remember: the top = where vy is 0.')+'</p>';}
      return h;}},
  {ch:CH3,target:()=>[chart],dim:true,title:P('기울기를 모은 그래프','A graph made of slopes'),body:()=>tr(`
    <p>위쪽 <span class="o">주황 그래프</span>는 높이, 아래쪽 <span class="bl">파란 그래프</span>는 위로 빠르기예요.</p>
    <p>주황이 <b>가파르게 오를 때</b> 파랑은 크고, <b>꼭대기에서 평평할 때</b> 파랑은 0, <b>내려갈 때</b> 파랑은 음수예요.</p>
    <div class="ex">파란 그래프 = 주황 그래프의 <b>매 순간 기울기</b>를 모아 그린 것.<br>이걸 <span class="o">도함수</span>(미분해서 나온 함수)라고 불러요.</div>
    <p>거꾸로, 파란 그래프의 넓이를 쌓으면 주황 그래프가 나와요. <b>미분과 적분은 서로를 되돌리는 관계</b>예요.</p>`,`
    <p>The upper <span class="o">orange graph</span> is height; the lower <span class="bl">blue graph</span> is upward speed.</p>
    <p>When orange <b>climbs steeply</b>, blue is large; when it’s <b>flat at the top</b>, blue is 0; when it <b>goes down</b>, blue is negative.</p>
    <div class="ex">Blue graph = the orange graph’s <b>slope at every moment</b>, collected into one graph.<br>That’s called the <span class="o">derivative</span> (the function you get by differentiating).</div>
    <p>Going backwards, stacking up the blue graph’s area gives you the orange graph. <b>Derivatives and integrals undo each other.</b></p>`)},

  {ch:CH4,target:()=>[FIELD()],ctrl:true,enter:()=>{if(airMode)setMode(false);setCharge(75);},
    waitLabel:P('서로 다른 각도로 4발 쏘기','Fire at 4 different angles'),gate:s=>new Set((s.exp||[]).map(q=>q.ang)).size>=4,
    on:{land:(s,r)=>{if(!r.out&&r.v0===75)(s.exp=s.exp||[]).push({ang:r.ang,dist:r.x-GUN_X});}},title:P('실험: 각도만 바꿔 보기','Experiment: change only the angle'),body:s=>{
      const e=s.exp||[],by={};e.forEach(q=>by[q.ang]=q.dist);const angs=Object.keys(by).map(Number).sort((a,b)=>a-b);
      let h='<p>'+tr(`장약을 <b>${chargeName(75)}</b>로 고정했어요. 이제 <b>각도만</b> 바꿔 가며 쏘고, 포탄이 얼마나 멀리 가는지 비교해 봐요. 깃발은 신경 쓰지 마세요.`,
        `The charge is locked at <b>${chargeName(75)}</b>. Now change <b>only the angle</b>, fire, and compare how far the shell goes. Ignore the flag.`)+'</p>'+
        `<p>${[30,40,45,50,60].map(a=>`<button class="act" data-act="seta" data-v="${a}">${a}°</button>`).join(' ')}</p>`;
      if(angs.length)h+='<table class="steps"><tr><td>'+tr('발사각','Launch angle')+'</td><td>'+tr('날아간 거리','Distance flown')+'</td></tr>'+angs.map(a=>`<tr><td>${a.toFixed(1)}°</td><td><b>${by[a].toFixed(0)} m</b></td></tr>`).join('')+'</table>';
      if(angs.length>=4)h+='<p class="fb">'+tr('40°·45°·50°는 거리가 <b>거의 같고</b>, 30°와 60°도 서로 <b>비슷하죠?</b> (땅 높낮이 때문에 조금씩 달라요) 왜 그런지 다음 단계에서 봐요.',
        '40°, 45° and 50° land <b>almost the same</b> distance, and 30° and 60° are <b>similar</b> too, right? (Uneven ground makes them differ a little.) We’ll see why next.')+'</p>';
      else h+='<p class="small">'+tr('각도 버튼을 누르고 발사! 서로 다른 각도로 4발 쏘면 넘어갈 수 있어요.','Pick an angle and fire! Fire at 4 different angles to move on.')+'</p>';
      // 다음 단계 그래프에 실험 점을 찍기 위해 저장
      angleExp=angs.map(a=>({ang:a,dist:by[a]}));
      return h;}},
  {ch:CH4,title:P('45°는 사거리 그래프의 꼭대기','45° is the top of the range graph'),body:()=>tr(`
    <p>가로는 발사각, 세로는 날아간 거리예요. <span class="o">주황 점</span>이 방금 실험한 결과예요.</p>
    ${rangeSvg(angleExp)}
    <p>이 그래프에도 <b>꼭대기</b>가 있죠? 3장에서 포탄의 꼭대기를 잡았을 때처럼, 꼭대기에서는 <b>기울기가 0</b>이에요.</p>
    <div class="ex">① 그래서 <b>45°가 가장 멀리</b> 가요. "변화가 0인 곳 = 가장 높은 곳"이 여기서도 통해요.<br>
    ② 45° 근처에서는 각도를 바꿔도 거리가 <b>거의 안 변해요</b>. 기울기가 0에 가까우니까요.<br>
    ③ 30°처럼 꼭대기에서 먼 곳은 기울기가 커서, <b>1°만 바꿔도 많이</b> 움직여요.</div>
    <p>그리고 그래프가 45°를 중심으로 <b>좌우 대칭</b>이라, 같은 거리를 맞히는 각도가 <b>두 개</b>(낮게 30°, 높게 60°) 있어요.</p>`,`
    <p>Across: launch angle. Up: distance flown. The <span class="o">orange dots</span> are your experiment.</p>
    ${rangeSvg(angleExp)}
    <p>This graph has a <b>top</b> too, right? Just like when you caught the shell’s top in Chapter 3, the <b>slope is 0</b> at the top.</p>
    <div class="ex">① That’s why <b>45° goes farthest</b>. “Where the change is 0 = the highest point” works here too.<br>
    ② Near 45°, changing the angle <b>barely changes</b> the distance, because the slope is almost 0.<br>
    ③ Far from the top, like at 30°, the slope is steep, so <b>even 1° moves it a lot</b>.</div>
    <p>And since the graph is <b>symmetric</b> around 45°, there are <b>two angles</b> that hit the same distance (low 30°, high 60°).</p>`)},
  quizStep({ch:CH4,title:QC,quiz:{q:P('45°로 쐈더니 깃발보다 <b>10 m 짧았어요</b>. 각도를 바꿔서 맞힐 수 있을까요?','You fired at 45° and landed <b>10 m short</b>. Can you hit by changing the angle?'),
    options:[P('아니요. 45°가 이 장약의 최대 사거리라 각도로는 더 멀리 못 가요','No. 45° is this charge’s max range, so no angle sends it farther'),P('네. 46°로 올리면 돼요','Yes. Raise it to 46°'),P('네. 30°로 내리면 돼요','Yes. Lower it to 30°')],answer:0,
    explain:P('45°는 꼭대기라 어느 쪽으로 바꿔도 거리가 <b>줄어요</b>. 더 멀리 보내려면 <b>장약을 올려야</b> 해요.','45° is the top, so changing it either way makes the shot <b>shorter</b>. To go farther you need a <b>bigger charge</b>.'),
    hint:P('사거리 그래프에서 45°보다 높은 점이 있었나요?','Was any point on the range graph higher than 45°?')}}),

  quizStep({ch:CH5,title:P('미분은 조준에도 쓰여요','Derivatives help you aim'),
    intro:()=>'<p>'+tr('미분은 "조금 바꾸면 결과가 <b>얼마나</b> 바뀌나?"를 재는 도구이기도 해요. 진짜 포병도 이걸로 조준을 고쳐요.',
      'A derivative also measures “if I change it a little, <b>how much</b> does the result change?” Real artillery crews correct their aim this way.')+'</p>',
    quiz:{q:P('각도를 <b>2°</b> 올렸더니 탄착점이 <b>30 m</b> 더 멀리 갔어요. 1°당 몇 m 움직일까요?','You raised the angle by <b>2°</b> and the impact moved <b>30 m</b> farther. How many metres per 1°?'),
    options:[P('15 m','15 m'),P('30 m','30 m'),P('60 m','60 m')],answer:0,
    explain:P('30 ÷ 2 = 15. 이 "1°당 15 m"가 <b>변화율</b>, 곧 미분값이에요.','30 ÷ 2 = 15. That “15 m per 1°” is the <b>rate of change</b>, i.e. the derivative.'),
    hint:P('30 m를 2로 나눠 보세요.','Divide 30 m by 2.')}}),
  {ch:CH5,target:()=>[FIELD()],ctrl:true,enter:()=>{if(airMode)setMode(false);aimSetup();},waitLabel:P('계산으로 명중시키기','Hit it using the math'),
    gate:s=>s.hit||(s.shots||[]).length>=6,auto:s=>s.hit,on:{land:aimOnLand},title:P('미션: 두 발로 재고, 계산으로 명중','Mission: measure with two shots, hit with math'),
    body:s=>'<p class="small">'+tr(`깃발까지 거리에 맞춰 <b>${chargeName(+$('vel').value)}</b>, 30°로 맞춰 뒀어요. 장약은 그대로 두고 <b>각도로만</b> 조준해요.`,
      `Set to <b>${chargeName(+$('vel').value)}</b> and 30° to suit the flag’s distance. Keep the charge and aim <b>with the angle only</b>.`)+'</p>'+
      aimBody(s)+((s.shots||[]).length>=6&&!s.hit?'<p class="small">'+tr('충분히 연습했어요. 다음으로 넘어가도 돼요.','You’ve practised plenty. Feel free to move on.')+'</p>':'')},

  {ch:CH6,target:()=>[FIELD()],ctrl:true,enter:()=>{if(!airMode)setMode(true);aimSetup();},on:{land:aimOnLand},title:P('공식이 통하지 않는 세상','When formulas break'),body:s=>tr(`
    <p><b>공기저항 + 바람</b> 모드로 바꿨어요. 공기는 빠를수록 세게 붙잡아서 포물선 공식이 <b>깨져요</b>. 힌트 버튼 숫자도 이제 틀려요.</p>
    <p>그래도 괜찮아요. 게임은 여전히 <b>0.01초씩 쌓아서(적분)</b> 포탄을 날리고, 우리는 <b>변화율(미분)</b>로 조준하면 되니까요. 진짜 사격통제 장치도 이렇게 해요.</p>`,`
    <p>Switched to <b>Air drag + wind</b> mode. Air grips the shell harder the faster it goes, which <b>breaks</b> the parabola formula. The hint numbers are off now, too.</p>
    <p>No problem. The game still flies the shell by <b>stacking 0.01 s pieces (integral)</b>, and we aim with the <b>rate of change (derivative)</b>. Real fire-control computers work the same way.</p>`)+aimBody(s)},

  quizStep({ch:CHE,title:P('마지막 문제','Last question'),quiz:{q:P('자동차 계기판의 <b>주행거리계</b>(지금까지 총 몇 km 달렸나)는 미분일까요, 적분일까요?','Is a car’s <b>odometer</b> (total km driven so far) a derivative or an integral?'),
    options:[P('미분','Derivative'),P('적분','Integral')],answer:1,
    explain:P('매 순간의 속도를 <b>쌓아서</b> 총 거리를 구하니 적분! 반대로 속도계는 미분이에요.','It <b>adds up</b> the speed at every moment to get the total distance, so it’s an integral! The speedometer is the derivative.'),
    hint:P('"지금 이 순간"일까요, "지금까지 모은 것"일까요?','Is it “right now” or “everything so far”?')}}),
  {ch:CHE,title:P('이제 미적분을 아는 포병','Now you’re a gunner who knows calculus'),body:()=>tr(`
    <table><tr><td><span class="o">미분</span></td><td><b>지금 이 순간</b> 얼마나 변하나<br><span class="small">파란 점선의 기울기 · 꼭대기에서 0 · 조준 수정</span></td></tr>
    <tr><td><span class="o">적분</span></td><td>작은 조각을 <b>쌓아서</b> 전체 구하기<br><span class="small">0.01초씩 쌓은 궤적 · 그래프 아래 넓이</span></td></tr></table>
    <p>둘은 <b>서로를 되돌리는 관계</b>예요. 높이를 미분하면 빠르기, 빠르기를 적분하면 높이.</p>
    <p>이제 자유롭게 쏴 보세요. 맨 위 버튼으로 언제든 다시 배울 수 있어요.</p>`,`
    <table><tr><td><span class="o">Derivative</span></td><td>How much it’s changing <b>right now</b><br><span class="small">slope of the blue dashed line · 0 at the top · aim correction</span></td></tr>
    <tr><td><span class="o">Integral</span></td><td><b>Stack up</b> small pieces to get the whole<br><span class="small">path built from 0.01 s pieces · area under the graph</span></td></tr></table>
    <p>They <b>undo each other</b>. Differentiate height to get speed; integrate speed to get height.</p>
    <p>Now fire freely. You can come back to the lessons anytime with the button at the top.</p>`)}
];

function tutClearHl(){tutHl.forEach(el=>el.classList.remove('tut-hl','dim'));tutHl=[];}
function tutRender(scroll){const s=TUT[ti];tutClearHl();
  $('tutStep').textContent=tx(s.ch)+' · '+(ti+1)+' / '+TUT.length;
  $('tutTitle').textContent=tx(s.title);$('tutBody').innerHTML=s.body(st);
  $('tutCtrl').hidden=!s.ctrl;updateFlightBtns();
  const els=s.target?s.target().filter(Boolean):[];
  els.forEach(el=>el.classList.add('tut-hl'));if(s.dim&&els[0])els[0].classList.add('dim');tutHl=els;
  $('tutDim').hidden=els.length>0;
  $('tutPrev').disabled=ti===0;
  const waiting=!!s.gate&&!s.gate(st);
  $('tutNext').disabled=waiting;
  $('tutNext').textContent=waiting?(tx(s.waitLabel)||tr('진행해 보세요','Do the task')):ti===TUT.length-1?tr('끝내기','Finish'):tr('다음','Next');
  if(scroll===false)return;
  if(els[0])els[0].scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  else window.scrollTo({top:0});}
function tutExit(){clearTimeout(tutTimer);if(ti>=0&&TUT[ti].exit)TUT[ti].exit(st);}
function tutGo(i){tutExit();ti=i;st={};if(TUT[ti].enter)TUT[ti].enter(st);tutRender();$('tut').scrollTop=0;}
function tutStart(){document.body.classList.add('tut-open');$('tut').hidden=false;tutGo(0);$('tutNext').focus();}
function tutEnd(){tutExit();tutClearHl();ti=-1;$('tut').hidden=true;$('tutDim').hidden=true;document.body.classList.remove('tut-open');
  try{localStorage.setItem('supojaTutDone','1');}catch(e){}}
// 게임 이벤트를 현재 단계에 전달하고 카드 갱신 (스크롤은 하지 않음)
function tutEmit(type,data){if(ti<0)return;const s=TUT[ti],h=s.on&&s.on[type];if(!h)return;
  h(st,data);tutRender(false);
  if(s.auto&&s.auto(st)&&!st.adv){st.adv=true;tutTimer=setTimeout(()=>tutGo(ti+1),1500);}}
$('tutBody').addEventListener('click',e=>{const q=e.target.closest('[data-q]');if(q){tutEmit('quiz',+q.dataset.q);return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='seta')setAngle(+a.dataset.v);else if(a.dataset.act==='setc')setCharge(+a.dataset.v);
  tutRender(false);});
$('tutOpen').onclick=tutStart;$('tutSkip').onclick=tutEnd;
$('tutPrev').onclick=()=>{if(ti>0)tutGo(ti-1);};
$('tutNext').onclick=()=>{if(ti>=TUT.length-1)tutEnd();else tutGo(ti+1);};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ti>=0)tutEnd();});

applyLang();updateFlightBtns();updateStats();resize();requestAnimationFrame(loop);
try{if(!localStorage.getItem('supojaTutDone'))tutStart();}catch(e){tutStart();}
})();
</script>
</body>
</html>
